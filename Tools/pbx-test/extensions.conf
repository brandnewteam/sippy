[general]
static=yes
writeprotect=yes

[testing]
; 600: answer and echo media back — enough to verify two-way RTP and the
; negotiated codec without a human on the far end.
exten => 600,1,Answer()
 same => n,Echo()

; 601: answer, wait, hang up — for call-teardown behavior.
exten => 601,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; Extension-to-extension dialing.
exten => 6001,1,Dial(PJSIP/6001,20)
exten => 6002,1,Dial(PJSIP/6002,20)
