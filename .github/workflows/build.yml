# Builds and tests Sippy with full Xcode on a GitHub macOS runner.
#
# - Pull requests (and manual runs): unit tests + an optimized, ad-hoc signed
#   Sippy.app, uploaded as a workflow artifact so it can be tried without a
#   local toolchain.
# - Published GitHub releases: same build, signed with the Developer ID
#   certificate and notarized, plus a signed Sparkle appcast.xml; then a
#   separate job (the only one with a write token) attaches both to the
#   release. The tag must match CFBundleShortVersionString (v0.1.0 or 0.1.0).
# - Manual runs with "sign" ticked: signed and notarized too, without a
#   release (to try signing before tagging).
#
# Signing secrets live in the "release" environment, which only main and
# release tags may use; PR builds never see them and stay ad-hoc signed.
# See README "Signing on CI" for the secrets.

name: Build

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with Developer ID and notarize
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90  # notarization alone can take half an hour
    # Only signed builds enter the environment holding the signing secrets.
    environment: ${{ (github.event_name == 'release' || inputs.sign) && 'release' || '' }}
    env:
      SIGN: ${{ github.event_name == 'release' || inputs.sign }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # CI has full Xcode, so a plain @State would build here but break
      # Command Line Tools builds (see Sources/SippyApp/Views/ViewState.swift).
      - name: No @State (use @ViewState)
        run: |
          if grep -rnE '^[^/]*@State([^A-Za-z0-9_]|$)' Sources; then
            echo "::error::Use @ViewState instead of @State (see Sources/SippyApp/Views/ViewState.swift)"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Support/Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = release ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::Release tag $tag doesn't match Info.plist version $version"
              exit 1
            fi
          fi

      # SwiftPM keeps downloaded binary artifacts (linphone xcframeworks,
      # Sparkle) in its shared cache; reusing it skips the linphone.org fetch.
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Vendor/linphone-sdk-swift-macos/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: make test

      # Temporary keychain holding only the Developer ID identity, plus
      # Apple's Developer ID G2 intermediate so codesign can build the chain.
      - name: Import signing certificate
        if: env.SIGN == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_password=$(openssl rand -base64 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          echo "Importing Developer ID certificate"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          # The runner image may already carry the intermediate, and then
          # security refuses the duplicate; a missing chain still fails the
          # valid-identity check below.
          echo "Importing Developer ID G2 intermediate"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" ||
            echo "Intermediate not imported (already present on the runner?)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No valid Developer ID Application identity in DEVELOPER_ID_P12_BASE64"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build app (release)
        run: make release IDENTITY="${IDENTITY:--}"

      - name: Notarize and staple
        if: env.SIGN == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_API_KEY" > "$key"
          make notarize \
            NOTARY_AUTH="--key $key --key-id $NOTARY_API_KEY_ID --issuer $NOTARY_API_ISSUER_ID"
          rm "$key"

      # Sparkle feed for this release, read by installed copies from
      # releases/latest/download/appcast.xml (SUFeedURL). The release notes
      # become its HTML description via GitHub's Markdown renderer.
      - name: Sparkle appcast
        if: github.event_name == 'release'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api markdown -f mode=gfm -f context="$GITHUB_REPOSITORY" \
            -f text="$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.html"
          Tools/make_appcast.sh "dist/Sippy-$VERSION.zip" "$TAG" \
            "$RUNNER_TEMP/release-notes.html"

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sippy-${{ steps.version.outputs.version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/Sippy-${{ steps.version.outputs.version }}.zip
            dist/appcast.xml
          retention-days: 14
          if-no-files-found: error

  # The only job with a write token, and it runs no project code: it just
  # attaches the zip and appcast the build job produced. PR and manual runs
  # skip it.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sippy-${{ needs.build.outputs.version }}-${{ github.sha }}

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        # The zip goes first: once appcast.xml is up, installed copies may
        # try to download it.
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "Sippy-${{ needs.build.outputs.version }}.zip" \
            --repo "${{ github.repository }}" --clobber
          gh release upload "${{ github.event.release.tag_name }}" appcast.xml \
            --repo "${{ github.repository }}" --clobber
